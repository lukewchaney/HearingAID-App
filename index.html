  :root { --serif:"Libre Baskerville", Georgia, "Times New Roman", serif; --bg:#f4f5f7; --card:#fff; --ink:#1c2430; --muted:#68758a; --line:#d5dae2; --accent:#1f4e8c; --err:#a4262c; --ok:#1e6b3a; --on-accent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14171c; --card:#1d222a; --ink:#e6e9ee; --muted:#93a0b4; --line:#333b48; --accent:#6aa2ea; --err:#ff8a8f; --ok:#79d09a; --on-accent:#0b1626; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#14171c; --card:#1d222a; --ink:#e6e9ee; --muted:#93a0b4; --line:#333b48; --accent:#6aa2ea; --err:#ff8a8f; --ok:#79d09a; --on-accent:#0b1626; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { max-width:620px; margin:0 auto; padding-block:24px 48px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  label { display:block; margin:0 0 12px; font-size:.9rem; color:var(--muted); }
  input, select, textarea { display:block; width:100%; margin-top:4px; padding:8px 10px; font:inherit; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:0; }
  .row { display:flex; gap:10px; }
  .row > label { flex:1; }
  .check { display:flex; align-items:center; gap:8px; color:var(--ink); }
  .check input { width:auto; margin:0; }
  .briefer { position:relative; border:1px solid var(--line); border-radius:8px; padding:12px 12px 0; margin-bottom:12px; }
  .b-remove { position:absolute; top:8px; right:8px; width:28px; height:28px; padding:0; border-radius:50%; line-height:1; font-size:1.1rem; color:var(--muted); }
  .b-remove:hover { color:var(--err); border-color:var(--err); }
  .briefer h3 { margin:0 0 8px; font-size:.95rem; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #create { width:100%; margin-top:16px; padding:12px; background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  #message { margin-top:14px; padding:10px 12px; border-radius:6px; border:1px solid; }
  #message.error { color:var(--err); } #message.ok { color:var(--ok); }
  [hidden] { display:none !important; }
  /* text logo (Libre Baskerville, embedded) */
  .logo { text-align:center; padding:18px 12px; margin:24px 0 32px; border-block:3px double var(--ink); font-family:var(--serif); }
  .logo .word { font-weight:700; font-size:clamp(2rem, 9vw, 3.2rem); line-height:1.05; letter-spacing:.01em; }
  .logo .word i { color:var(--accent); font-style:normal; letter-spacing:.06em; }
  .logo .full { margin-top:10px; font-size:.78rem; line-height:1.4; letter-spacing:.2em; text-transform:uppercase; }
  .logo .by { margin-top:8px; font-style:italic; font-size:.85rem; line-height:1.3; color:var(--muted); }
  .menu { display:flex; flex-direction:column; gap:14px; }
  .menu-item { display:flex; justify-content:space-between; align-items:center; width:100%; padding:20px 22px; font-size:1.15rem; font-weight:600;
    background:var(--card); border:1px solid var(--line); border-radius:10px; text-align:left; }
  .menu-item span { font-size:.8rem; font-weight:400; color:var(--muted); }
  .menu-item:disabled { opacity:.6; cursor:not-allowed; }
  .menu-item:disabled:hover { border-color:var(--line); }
  .topbar { display:flex; justify-content:space-between; gap:12px; margin-bottom:12px; }
  hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
</style>
</head>
<body>
<main>
  <section id="view-menu">
    <div class="logo" id="logo">
      <div class="word">Hearing<i>AID</i></div>
      <div class="full">Hearing Automatic Information Deployer</div>
      <div class="by">A Luke Chaney app</div>
    </div>
    <nav class="menu">
      <button type="button" class="menu-item" id="go-hearing">Deploy Hearing Materials</button>
      <button type="button" class="menu-item" disabled>Analyze Transcript <span>Coming soon</span></button>
      <button type="button" class="menu-item" disabled>Create Checklist <span>Coming soon</span></button>
    </nav>
  </section>

  <section id="view-hearing" hidden>
  <div class="topbar">
    <button type="button" id="back">&larr; Main menu</button>
    <button type="button" id="clear">Clear All</button>
  </div>
  <h1>Deploy Hearing Materials</h1>
  <div class="card">
    <label>Hearing type
      <select id="kind"><option value="full">Full Committee Hearing</option><option value="sub">Subcommittee Hearing</option></select>
    </label>
    <label id="sub-row" hidden>Subcommittee <select id="sub"></select></label>
    <label>Title <textarea id="title" rows="3" placeholder="To receive an update on ..."></textarea></label>

    <label class="check"><input type="checkbox" id="svc" checked> SVC (Room SVC-217, Office of Senate Security)</label>
    <label id="room-row" hidden>Room <input id="room" placeholder="e.g. Room SH-216"></label>

    <label>Hearing date <input type="date" id="date"></label>
    <div class="row">
      <label>Time <input id="time" placeholder="9:30" inputmode="numeric"></label>
      <label>AM / PM <select id="ampm"><option>AM</option><option>PM</option></select></label>
      <label>Open or closed <select id="status"><option>Open</option><option>Closed</option></select></label>
    </div>
    <div class="row">
      <label>Meeting type <select id="mtype"></select></label>
      <label>Classification <select id="classification"></select></label>
    </div>
    <label>Notice number <input id="notice" inputmode="numeric" style="max-width:140px"></label>

    <hr>
    <div id="briefers"></div>
    <div class="row" style="justify-content:center">
      <button type="button" id="add">+ Add witness</button>
    </div>

    <button type="button" id="create">Create Hearing Materials</button>
    <div id="message" hidden></div>
  </div>
  </section>
</main>

<script>
// Hearing Materials - runs entirely in the browser. Port of engine.py.
// Fills the embedded Word templates (TEMPLATES, base64) and downloads one ZIP.

const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const SUBCOMMITTEES = ["Airland", "Cybersecurity", "Emerging Threats and Capabilities", "Personnel",
  "Readiness", "Seapower", "Strategic Forces"];
const SMALL_WORDS = new Set(["a", "an", "and", "as", "at", "but", "by", "for", "in", "of", "on", "or", "the", "to", "with"]);
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
// Nameplate text box: width minus left/right insets, in points (from the template).
const NAMEPLATE_BOX_WIDTH_PT = (10034650 - 2 * 91440) / 12700;
const NAMEPLATE_MAX_PT = 85;

// ---------- text helpers ----------

function longDate(d) { return `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function parseIsoDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
const pad2 = (n) => String(n).padStart(2, "0");

function titleCase(text) {
  const words = text.split(/\s+/).filter(Boolean);
  return words.map((w, i) => {
    if (w !== w.toLowerCase() || /\d/.test(w)) return w;                      // acronyms, J3, etc.
    if (SMALL_WORDS.has(w) && i > 0 && i < words.length - 1) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");
}
function cleanFilename(s) { return s.replace(/[<>:"/\\|?*]/g, "").trim(); }

// ---------- docx XML helpers ----------

const paragraphsOf = (xml) => Array.from(xml.getElementsByTagNameNS(W, "p"));
const runsOf = (p) => Array.from(p.childNodes).filter((n) => n.nodeType === 1 && n.namespaceURI === W && n.localName === "r");

function runText(r) {
  let s = "";
  for (const c of Array.from(r.childNodes)) {
    if (c.namespaceURI !== W) continue;
    if (c.localName === "t") s += c.textContent;
    else if (c.localName === "tab") s += "\t";
    else if (c.localName === "br" || c.localName === "cr") s += "\n";
    else if (c.localName === "noBreakHyphen") s += "-";
  }
  return s;
}
function setRunText(r, text) {
  const xml = r.ownerDocument;
  for (const c of Array.from(r.childNodes)) if (!(c.namespaceURI === W && c.localName === "rPr")) r.removeChild(c);
  let buf = "";
  const flush = () => {
    if (!buf) return;
    const t = xml.createElementNS(W, "w:t");
    t.setAttributeNS("http://www.w3.org/XML/1998/namespace", "xml:space", "preserve");
    t.textContent = buf;
    r.appendChild(t);
    buf = "";
  };
  for (const ch of text) {
    if (ch === "\t") { flush(); r.appendChild(xml.createElementNS(W, "w:tab")); }
    else if (ch === "\n") { flush(); r.appendChild(xml.createElementNS(W, "w:br")); }
    else buf += ch;
  }
  flush();
}
const parText = (p) => runsOf(p).map(runText).join("");

function replaceBrackets(p, reps) {
  const text = parText(p);
  const spans = [...text.matchAll(/\[[^\]]*\]/g)].map((m) => [m.index, m.index + m[0].length]);
  if (spans.length !== reps.length) throw new Error(`Template changed: expected ${reps.length} brackets, found ${spans.length} in "${text.slice(0, 60)}"`);
  for (let k = spans.length - 1; k >= 0; k--) {
    const [s, e] = spans[k];
    const rep = reps[k];
    let pos = 0;
    const offsets = runsOf(p).map((r) => { const t = runText(r); const o = [r, pos, pos + t.length, t]; pos += t.length; return o; });
    const anchor = e - s > 2 ? s + 1 : s;
    const keep = offsets.find(([, a, b]) => a <= anchor && anchor < b)[0];
    for (const [r, a, b, t] of offsets) {
      if (b <= s || a >= e) continue;
      const lo = Math.max(s, a) - a, hi = Math.min(e, b) - a;
      setRunText(r, t.slice(0, lo) + (r === keep ? rep : "") + t.slice(hi));
    }
  }
}
function setText(p, text) {
  const runs = runsOf(p);
  const keep = runs.find((r) => runText(r).replace(/[\[\]]/g, "")) || runs[0];
  for (const r of runs) setRunText(r, r === keep ? text : "");
}
function stripBrackets(p) { for (const r of runsOf(p)) setRunText(r, runText(r).replace(/[\[\]]/g, "")); }
function removeNode(n) { n.parentNode.removeChild(n); }
function checkNoBrackets(xml, name) {
  for (const p of paragraphsOf(xml)) {
    const t = parText(p);
    if (t.includes("[") || t.includes("]")) throw new Error(`${name}: placeholder left unfilled: ${t.slice(0, 60)}`);
  }
}

// ---------- documents ----------

function fillBriefers(xml, h) {
  const paras = paragraphsOf(xml);
  const heading = paras.findIndex((p) => /^(Briefer|Witness)/.test(parText(p)));
  const noticeI = paras.findIndex((p, i) => i > heading && parText(p).includes("Notice"));
  const nonEmpty = (i) => parText(paras[i]).trim() !== "";
  let first = -1, last = -1, blank = -1;
  for (let i = heading + 1; i < noticeI; i++) if (nonEmpty(i)) { first = i; break; }
  for (let i = noticeI - 1; i >= first; i--) if (nonEmpty(i)) { last = i; break; }
  for (let i = first; i < last; i++) if (!nonEmpty(i)) { blank = i; break; }
  if (first < 0 || last < 0 || blank < 0) throw new Error("Notice template: witness section not recognised");
  const lineTpl = paras[first].cloneNode(true);
  const blankTpl = paras[blank].cloneNode(true);
  const parent = paras[last].parentNode;
  const anchor = paras[last].nextSibling;
  for (let i = first; i <= last; i++) removeNode(paras[i]);

  const briefers = h.briefers.filter((b) => !isBlankBriefer(b));
  briefers.forEach((b, n) => {
    for (const line of b.noticeInfo.split(/\r?\n/).map((s) => s.trim())) {
      if (!line) continue;
      const p = lineTpl.cloneNode(true);
      parent.insertBefore(p, anchor);
      setText(p, line);
    }
    if (n < briefers.length - 1) parent.insertBefore(blankTpl.cloneNode(true), anchor);
  });
}

// Notice number: always bottom-right of the page, wherever the witness list ends.
// Uses a Word text frame anchored to the bottom of the page margins. Open hearings add the
// disclaimer in an identical frame, which Word merges with the number's: number first, disclaimer below.
function textWidthTwips(xml) {
  const sect = Array.from(xml.getElementsByTagNameNS(W, "sectPr")).pop();
  const num = (tag, attr) => Number((sect && Array.from(sect.children).find((c) => c.localName === tag) || { getAttributeNS: () => 0 }).getAttributeNS(W, attr));
  const width = num("pgSz", "w") - num("pgMar", "left") - num("pgMar", "right");
  return width > 0 ? width : 9360;
}

function pinToBottom(p, width) {
  const xml = p.ownerDocument;
  const el = (name) => xml.createElementNS(W, "w:" + name);
  let pPr = Array.from(p.children).find((c) => c.localName === "pPr");
  if (!pPr) { pPr = el("pPr"); p.insertBefore(pPr, p.firstChild); }
  // remove any old frame and the indent that used to push the text right (it would not fit in the frame)
  for (const old of Array.from(pPr.children).filter((c) => ["framePr", "ind"].includes(c.localName))) pPr.removeChild(old);
  const frame = el("framePr");
  for (const [k, v] of Object.entries({ w: String(width), wrap: "around", vAnchor: "margin", hAnchor: "margin", xAlign: "left", yAlign: "bottom" }))
    frame.setAttributeNS(W, "w:" + k, v);
  // schema order: pStyle, keepNext, keepLines, pageBreakBefore, then framePr
  const before = Array.from(pPr.children).filter((c) => ["pStyle", "keepNext", "keepLines", "pageBreakBefore"].includes(c.localName)).pop();
  pPr.insertBefore(frame, before ? before.nextSibling : pPr.firstChild);
  return pPr;
}

function pinNoticeNumber(p, width) {
  const xml = p.ownerDocument;
  // drop the empty spacer paragraphs before it (they would only push it onto a second page)
  for (let prev = p.previousElementSibling; prev && prev.localName === "p" && !parText(prev).trim() &&
       !prev.getElementsByTagNameNS(W, "drawing").length && !prev.getElementsByTagNameNS(W, "sectPr").length &&
       !prev.getElementsByTagNameNS(W, "br").length; prev = p.previousElementSibling) removeNode(prev);
  setText(p, parText(p).replace(/^[\s ]+/, ""));       // tabs / spaces that used to push it right
  const pPr = pinToBottom(p, width);
  let jc = Array.from(pPr.children).find((c) => c.localName === "jc");
  if (!jc) {
    jc = xml.createElementNS(W, "w:jc");
    const rPr = Array.from(pPr.children).find((c) => c.localName === "rPr");
    pPr.insertBefore(jc, rPr || null);
  }
  jc.setAttributeNS(W, "w:val", "right");
}

// Disclaimer under the notice number on open hearings (text comes from "open bottom text.docx").
function addOpenDisclaimer(numberPar, width) {
  const xml = numberPar.ownerDocument;
  const mk = (name, attrs = {}) => {
    const e = xml.createElementNS(W, "w:" + name);
    for (const [k, v] of Object.entries(attrs)) e.setAttributeNS(W, "w:" + k, v);
    return e;
  };
  const p = mk("p");
  const pPr = mk("pPr");
  p.appendChild(pPr);
  pPr.appendChild(mk("pStyle", { val: "Default" }));
  pinToBottom(p, width);                                              // same frame as the number
  pPr.appendChild(mk("spacing", { before: "240", after: "0" }));
  pPr.appendChild(mk("jc", { val: "center" }));
  const rPr = () => {
    const r = mk("rPr");
    r.appendChild(mk("rFonts", { ascii: "Arial", hAnsi: "Arial", cs: "Arial" }));
    for (const t of ["b", "bCs", "i", "iCs"]) r.appendChild(mk(t));
    r.appendChild(mk("sz", { val: "20" }));
    r.appendChild(mk("szCs", { val: "20" }));
    return r;
  };
  const run = mk("r");
  run.appendChild(rPr());
  const t = mk("t");
  t.textContent = OPEN_BOTTOM_TEXT;
  run.appendChild(t);
  p.appendChild(run);
  numberPar.parentNode.insertBefore(p, numberPar.nextSibling);
}

function buildNotice(xml, h) {
  fillBriefers(xml, h);
  const paras = paragraphsOf(xml);
  const timeTxt = `${h.time.trim()} ${h.ampm === "AM" ? "a.m." : "p.m."}`;
  paras.forEach((p, i) => {
    const t = parText(p);
    if (!t.includes("[")) return;
    if (t.includes("[X]")) {
      replaceBrackets(p, [h.noticeNumber.trim()]);
      const width = textWidthTwips(xml);
      pinNoticeNumber(p, width);
      if (h.status === "Open") addOpenDisclaimer(p, width);
    }
    else if (t.startsWith("SUBCOMMITTEE")) replaceBrackets(p, [h.subcommittee.toUpperCase()]);
    else if (t.includes("Room")) {
      const next = paras[i + 1];                       // second line: the Senate Security office (SVC only)
      if (h.svc) { stripBrackets(p); stripBrackets(next); }
      else { setText(p, h.room.trim()); stripBrackets(p); removeNode(next); }
    }
    else if ((t.match(/\[/g) || []).length === 2) replaceBrackets(p, [longDate(h.date), timeTxt]);
    else if (["[OPEN]", "[CLOSED]"].includes(t.trim())) replaceBrackets(p, [h.status.toUpperCase()]);
    else if (t.trim().startsWith("[To ")) replaceBrackets(p, [titleCase(h.title.trim())]);
  });
  checkNoBrackets(xml, "Notice");
}

function buildUC(xml, h) {
  const now = new Date();
  const todayTxt = `${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  const timeTxt = `${h.time.trim()} ${h.ampm[0]}.M.`;
  for (const p of paragraphsOf(xml)) {
    const t = parText(p);
    if (!t.includes("[")) continue;
    if (t.includes("MR. PRESIDENT")) {
      const reps = h.kind === "sub" ? [h.subcommittee.toUpperCase()] : [];
      reps.push(longDate(h.date).toUpperCase(), timeTxt, h.status.toUpperCase(), h.title.trim().toUpperCase());
      replaceBrackets(p, reps);
    } else replaceBrackets(p, [todayTxt]);             // date line at the top of the page
  }
  checkNoBrackets(xml, "UC");
}

function fitFontSize(text) {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = "bold 1000px Arial, 'Liberation Sans', Helvetica, sans-serif";
  const widthPerPt = ctx.measureText(text).width / 1000;
  const size = (NAMEPLATE_BOX_WIDTH_PT / widthPerPt) * 0.97;
  return Math.max(8, Math.min(NAMEPLATE_MAX_PT, Math.floor(size * 2) / 2));
}

function buildNameplate(xml, text) {
  const half = String(Math.floor(fitFontSize(text) * 2));       // Word stores half-points
  for (const p of paragraphsOf(xml)) if (parText(p).includes("[")) replaceBrackets(p, [text]);
  for (const tag of ["sz", "szCs"])
    for (const el of Array.from(xml.getElementsByTagNameNS(W, tag))) el.setAttributeNS(W, "w:val", half);
  checkNoBrackets(xml, "Nameplate");
}

// ---------- Alderson sheet ----------

const MEETING_TYPES = ["Hearing", "Briefing", "Meeting", "Executive", "Markup"];
const CLASSIFICATIONS = ["Unclassified", "Secret", "Top Secret", "SCI", "Restricted data (Q)", "SAP"];
const ALDERSON_BLUE = "4472C4";   // Word "Blue, Accent 1" (68, 114, 196)
// the sheet spells this subcommittee out in full
const ALDERSON_PANEL_NAMES = { Readiness: "Readiness and Management Support" };

// CT_RPr child order matters to Word: b follows rStyle/rFonts, color comes before spacing/kern/sz/etc.
const RPR_AFTER_COLOR = ["spacing", "w", "kern", "position", "sz", "szCs", "highlight", "u", "effect", "bdr", "shd", "fitText",
  "vertAlign", "rtl", "cs", "em", "lang", "eastAsianLayout", "specVanish", "oMath"];

function makeBold(r, blue) {
  const xml = r.ownerDocument;
  let rPr = Array.from(r.children).find((c) => c.localName === "rPr");
  if (!rPr) { rPr = xml.createElementNS(W, "w:rPr"); r.insertBefore(rPr, r.firstChild); }
  const kids = () => Array.from(rPr.children);
  if (!kids().some((c) => c.localName === "b")) {
    const anchor = kids().filter((c) => ["rStyle", "rFonts"].includes(c.localName)).pop();
    rPr.insertBefore(xml.createElementNS(W, "w:b"), anchor ? anchor.nextSibling : rPr.firstChild);
  }
  if (blue) {
    let color = kids().find((c) => c.localName === "color");
    if (!color) {
      color = xml.createElementNS(W, "w:color");
      rPr.insertBefore(color, kids().find((c) => RPR_AFTER_COLOR.includes(c.localName)) || null);
    }
    for (const a of Array.from(color.attributes)) if (a.localName !== "val") color.removeAttributeNode(a);  // drop theme colors
    color.setAttributeNS(W, "w:val", ALDERSON_BLUE);
  }
}

// Insert text in front of the paragraph's tab (the tab draws the underline that follows the entry).
function fillBeforeTab(p, text, bold) {
  const tabRun = runsOf(p).filter((r) => Array.from(r.children).some((c) => c.localName === "tab")).pop();
  if (!tabRun) throw new Error("Alderson template: entry line not recognised");
  const run = tabRun.cloneNode(true);
  setRunText(run, text);
  if (bold) makeBold(run, false);
  p.insertBefore(run, tabRun);
}

function buildAlderson(xml, h) {
  const panel = h.kind === "full" ? "Senate Armed Services Committee" : (ALDERSON_PANEL_NAMES[h.subcommittee] || h.subcommittee);
  const targets = [panel, h.meetingType, h.status, h.classification];     // one per column of the table
  const tbl = xml.getElementsByTagNameNS(W, "tbl")[0];
  const found = [0, 0, 0, 0];
  for (const row of Array.from(tbl.children).filter((c) => c.localName === "tr")) {
    Array.from(row.children).filter((c) => c.localName === "tc").slice(0, 4).forEach((cell, col) => {
      for (const p of Array.from(cell.children).filter((c) => c.localName === "p")) {
        if (parText(p).trim() === targets[col]) { runsOf(p).forEach((r) => makeBold(r, true)); found[col]++; }
      }
    });
  }
  found.forEach((n, col) => {
    if (n !== 1) throw new Error(`Alderson sheet: could not find "${targets[col]}" in the table`);
  });
  for (const p of paragraphsOf(xml)) {
    const t = parText(p);
    if (t.startsWith("Day/date/year of hearing")) fillBeforeTab(p, `${pad2(h.date.getMonth() + 1)}/${pad2(h.date.getDate())}/${h.date.getFullYear()}`, false);
    else if (t.startsWith("Title of hearing")) fillBeforeTab(p, titleCase(h.title.trim().replace(/\s+/g, " ")), true);
  }
}

// ---------- packaging ----------

const isBlankBriefer = (b) => !(b.rank.trim() || b.name.trim() || b.noticeInfo.trim());

function validate(h) {
  if (h.kind === "sub" && !h.subcommittee) throw new Error("Choose a subcommittee.");
  if (!h.svc && !h.room.trim()) throw new Error("Enter a room (or check SVC).");
  if (!h.date) throw new Error("Enter the hearing date.");
  if (!/^\d{1,2}:\d{2}$/.test(h.time.trim())) throw new Error("Enter the time like 9:30.");
  if (!h.title.trim()) throw new Error("Enter the hearing title.");
  if (!MEETING_TYPES.includes(h.meetingType)) throw new Error("Choose the meeting type.");
  if (!CLASSIFICATIONS.includes(h.classification)) throw new Error("Choose the classification.");
  if (!h.noticeNumber.trim()) throw new Error("Enter the notice number.");
  const bs = h.briefers.filter((b) => !isBlankBriefer(b));
  if (!bs.length) throw new Error("Add at least one witness.");
  if (bs.some((b) => !b.name.trim() || !b.noticeInfo.trim()))
    throw new Error("Each witness needs a name (for the nameplate) and notice information.");
}

function folderName(h) {
  const kind = h.kind === "full" ? "Full" : h.subcommittee;
  const status = h.status[0].toUpperCase() + h.status.slice(1).toLowerCase();
  const d = h.date;
  return cleanFilename(`${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}-${String(d.getFullYear()).slice(-2)} - ${kind} - ${status} ${titleCase(h.title.trim())}`).slice(0, 150);
}

async function fillTemplate(b64, edit) {
  const zip = await JSZip.loadAsync(b64, { base64: true });
  const raw = await zip.file("word/document.xml").async("string");
  const xml = new DOMParser().parseFromString(raw, "application/xml");
  if (xml.getElementsByTagName("parsererror").length) throw new Error("Could not read a template.");
  edit(xml);
  const out = new XMLSerializer().serializeToString(xml);
  zip.file("word/document.xml", out.startsWith("<?xml") ? out : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + out);
  return zip.generateAsync({ type: "uint8array", compression: "DEFLATE" });
}

async function createMaterials(h) {
  validate(h);
  const t = TEMPLATES[h.kind];
  const folder = folderName(h);
  const files = {};
  files["Notice.docx"] = await fillTemplate(t.notice, (x) => buildNotice(x, h));
  files["UC.docx"] = await fillTemplate(t.uc, (x) => buildUC(x, h));
  files["Alderson Sheet.docx"] = await fillTemplate(t.alderson, (x) => buildAlderson(x, h));
  for (const b of h.briefers.filter((x) => !isBlankBriefer(x))) {
    const text = `${b.rank.trim()} ${b.name.trim()}`.trim();
    let name = cleanFilename(`Nameplate - ${text}.docx`);
    for (let n = 2; files[name]; n++) name = cleanFilename(`Nameplate - ${text} (${n}).docx`);
    files[name] = await fillTemplate(t.nameplate, (x) => buildNameplate(x, text));
  }
  const zip = new JSZip();
  for (const [name, data] of Object.entries(files)) zip.file(`${folder}/${name}`, data);
  const blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
  return { folder, blob, names: Object.keys(files) };
}

// ---------- page ----------

const $ = (id) => document.getElementById(id);

function renumberBriefers() {
  const cards = Array.from(document.querySelectorAll(".briefer"));
  cards.forEach((card, i) => {
    card.querySelector("h3").textContent = `Witness ${i + 1}`;
    const minus = card.querySelector(".b-remove");
    minus.setAttribute("aria-label", `Remove witness ${i + 1}`);
    minus.hidden = cards.length === 1;                 // always keep one witness
  });
}

function addBriefer() {
  const div = document.createElement("div");
  div.className = "briefer";
  div.innerHTML = `<button type="button" class="b-remove" title="Remove this witness">&minus;</button>
    <h3></h3>
    <label>Title or Rank <input class="b-rank" placeholder="e.g. Brig Gen"></label>
    <label>Name (nameplate) <input class="b-name" placeholder="e.g. Messer"></label>
    <label>Notice information <textarea class="b-info" rows="3" placeholder="Honorable Jane Doe&#10;Assistant Secretary of Defense"></textarea></label>`;
  div.querySelector(".b-remove").addEventListener("click", () => { div.remove(); renumberBriefers(); });
  $("briefers").appendChild(div);
  renumberBriefers();
}

function updateLayout() {
  $("sub-row").hidden = $("kind").value !== "sub";
  $("room-row").hidden = $("svc").checked;
}

function collect() {
  return {
    kind: $("kind").value,
    subcommittee: $("kind").value === "sub" ? $("sub").value : "",
    svc: $("svc").checked,
    room: $("room").value,
    date: $("date").value ? parseIsoDate($("date").value) : null,
    time: $("time").value,
    ampm: $("ampm").value,
    status: $("status").value,
    meetingType: $("mtype").value,
    classification: $("classification").value,
    title: $("title").value,
    noticeNumber: $("notice").value,
    briefers: Array.from(document.querySelectorAll(".briefer")).map((d) => ({
      rank: d.querySelector(".b-rank").value, name: d.querySelector(".b-name").value, noticeInfo: d.querySelector(".b-info").value,
    })),
  };
}

function showMessage(text, isError) {
  const m = $("message");
  m.textContent = text;
  m.className = isError ? "error" : "ok";
  m.hidden = false;
}

// Hosted on claude.ai the page cannot start a download itself; it asks the viewer through the
// `downloads` capability. Opened as a plain file, a normal download link works.
async function deliver(blob, filename) {
  const downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (downloads) { await downloads.save({ filename, data: blob }); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function onCreate() {
  $("message").hidden = true;
  try {
    const result = await createMaterials(collect());
    await deliver(result.blob, `${result.folder}.zip`);
    showMessage(`Downloaded "${result.folder}.zip" containing: ${result.names.join(", ")}. Unzip it to get the folder.`, false);
  } catch (e) {
    showMessage(e && e.code === "declined" ? "Download cancelled." : (e && e.message) || "Could not create the files.", true);
  }
}

// Back to the page as it first opens.
function clearAll() {
  $("kind").value = "full";
  for (const id of ["sub", "room", "date", "time", "title", "notice", "mtype", "classification"]) $(id).value = "";
  $("svc").checked = true;
  $("ampm").value = "AM";
  $("status").value = "Open";
  $("briefers").innerHTML = "";
  addBriefer();
  $("message").hidden = true;
  updateLayout();
}

function showView(name) {
  $("view-menu").hidden = name !== "menu";
  $("view-hearing").hidden = name !== "hearing";
  window.scrollTo(0, 0);
}

function init() {
  $("go-hearing").addEventListener("click", () => showView("hearing"));
  $("back").addEventListener("click", () => showView("menu"));
  $("clear").addEventListener("click", clearAll);
  showView("menu");
  $("sub").innerHTML = '<option value="">Choose...</option>' + SUBCOMMITTEES.map((s) => `<option>${s}</option>`).join("");
  const options = (list) => '<option value="">Choose...</option>' + list.map((o) => `<option>${o}</option>`).join("");
  $("mtype").innerHTML = options(MEETING_TYPES);
  $("classification").innerHTML = options(CLASSIFICATIONS);
  $("kind").addEventListener("change", updateLayout);
  $("svc").addEventListener("change", updateLayout);
  $("add").addEventListener("click", addBriefer);
  $("create").addEventListener("click", onCreate);
  addBriefer();
  updateLayout();
}
window.addEventListener("DOMContentLoaded", init);

</script>
